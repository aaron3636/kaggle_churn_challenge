[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "Streamlit app predicting music-streaming subscriber churn from event logs."
readme = "README.md"
requires-python = "==3.11.*"
authors = [{ name = "Aaron" }]
dependencies = [
  "pandas>=2.2",
  "pyarrow>=17.0",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "streamlit>=1.38",
  "joblib>=1.4",
  "plotly>=5.24",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "pre-commit>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["churn*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
