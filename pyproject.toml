[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-package"
version = "0.1.0"
description = "Tools to visualize user behavior and predict churn."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Your Name" }]
license = { file = "LICENSE" }
dependencies = [
  "pandas>=2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
